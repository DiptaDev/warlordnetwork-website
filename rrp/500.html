<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../logo.jpg">
    <title>WarLord Network | 500 Internal Server Error</title>
    <style>
        body {
            background-color: #0f0f0f;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        .warning {
            color: #ff5555;
            font-size: 8rem;
            filter: drop-shadow(0 0 10px rgba(255, 85, 85, 0.7));
            animation: pulse 1.5s infinite;
            margin-bottom: 10px;
        }

        .error-code {
            color: #ff5555;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.5);
        }

        .home-button {
            background-color: #f54141;;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-button:hover {
            background-color: #ca2424;;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .home-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

    </div>
